[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast, isolated, no I/O or network",
    "integration: multiple components together, may use tmp_path or in-memory sqlite",
    "characterization: pins current pre-migration behavior of a KEEP-AS-IS/MODIFY component; must never assert document-era behavior that Phase 1 is expected to change",
]
addopts = "--strict-markers -ra --cov=src --cov=observability --cov=db --cov-report=term-missing --cov-report=xml --cov-fail-under=0"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
omit = ["*/__pycache__/*", "tests/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
# src/ingestion/parser.py is deleted whole-file in Phase 1 Step 1.2 (RAG_MIGRATION_AUDIT.md
# SCRAP list) — not worth linting into shape now.
extend-exclude = ["src/ingestion/parser.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line too long) is left to black; ruff would otherwise double-report the same
# thing black already enforces.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing lint debt in the legacy document-RAG codebase, grandfathered as of
# Phase 0 Step 0.1's baseline formatting pass. Not fixed now — same rationale as
# the mypy excludes above: fixing 72 scattered findings across the legacy codebase
# would turn a mechanical formatting step into an unscoped remediation project.
# `select` above still holds full strength for all new code (tests/, ipc/, db/,
# and anything Phase 1+ rewrites) — these entries only grandfather what already
# existed at Step 0.1. Clear an entry when its file is next rewritten/touched by
# a migration step, not by leaving the suppression in place indefinitely.
"dashboard/app.py" = ["E402"]                        # sys.path/dotenv setup before imports
"eval/run_ragas_eval.py" = ["E402"]                  # same
"scripts/simulate_traffic.py" = ["E402"]             # same
"src/common/llm_client.py" = ["B904"]                # raise-without-from in except blocks
"src/generation/prompt_builder.py" = ["F601", "F841"]
"src/retrieval/confidence.py" = ["F841"]
"src/retrieval/context_builder.py" = ["F841"]
"src/retrieval/hybrid_search.py" = ["B904", "F401", "F402"]
# E722 (2 bare excepts in _fallback_search/_get_component_fallback) was fixed by
# Phase 0 Step 0.2. F841 (in _handle_decomposed, deliberately untouched per Step
# 0.2's scope) is separate, longer-lived debt — deleted whole in Phase 1 Step 1.3.
"src/retrieval/orchestrator.py" = ["F841"]
"src/retrieval/query_expander.py" = ["B007"]
"src/retrieval/reranker.py" = ["B904", "F401", "F841"]
"tools/retrieval_debug_server.py" = ["B904"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
warn_return_any = false
# Lenient, not strict: the acceptance criterion is "lint checks pass on the existing
# unmodified codebase," not a typing-remediation project. Tighten per-module as Phase 1
# rewrites land, not now. The excludes below are components deleted/never-wired-up per
# RAG_MIGRATION_AUDIT.md's SCRAP list and not worth typing at all.
exclude = [
    "^src/ingestion/parser\\.py$",
    "^src/retrieval/pipelines/",
    "^tools/",
]

# Pre-existing type errors in the legacy document-RAG codebase, grandfathered as of
# Phase 0 Step 0.1's baseline formatting pass (55 errors across these 11 modules,
# found by running mypy for the first time against previously-unchecked code —
# re-verified during a later audit pass; update this count if the module list below
# ever changes) — same
# "don't turn a mechanical setup step into an unscoped remediation project" rationale
# as the ruff per-file-ignores below. orchestrator.py and llm_client.py (Phase 0 Step
# 0.2's two bug-fix targets) are deliberately NOT in this list — both are fully mypy-
# clean after that step's fixes, save 3 lines of genuinely pre-existing, unrelated
# debt in orchestrator.py handled with precise inline `# type: ignore[...]` comments
# instead of a blanket module ignore, so the rest of both files keeps real mypy
# coverage going forward. Clear an entry in this list only when the module is
# actually rewritten/touched by a migration step, not by patching individual errors
# in place.
[[tool.mypy.overrides]]
module = [
    "src.retrieval.query_rewriter",
    "src.ingestion.embedder",
    "src.retrieval.metadata_filter",
    "src.ingestion.vector_store",
    "src.generation.config",
    "src.retrieval.hybrid_search",
    "src.ingestion.chunker",
    "src.ingestion.cleaner",
    "src.retrieval.reranker",
    "src.retrieval.query_expander",
    "src.ingestion.metadata_extractor",
]
ignore_errors = true
