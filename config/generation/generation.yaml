# Generation Pipeline Configuration (Phase 1 Step 1.4 — session companion)
# Loaded by GenerationConfig.from_yaml()

config_version: "2.0.0"
generation_version: "2.0.0"
prompt_version: "2.0.0"

default_mode: "context_aware"
default_model_key: "ollama_default"

# Generation modes. prompt_id is a free-form string -> config/generation/prompts/<id>.yaml;
# Step 1.5 feature handlers select the action-type templates by prompt_id directly.
modes:
  context_aware:
    mode: "context_aware"
    prompt_id: "context_aware"
    model_key: "ollama_default"
    answer_format: "markdown"
    citation_style: "inline"
    include_context_header: true
    max_context_tokens: 3000
    system_instructions: >
      Answer from the user's own past conversations and notes only. Cite each
      claim with its session/record. If nothing relevant was found, say so.

  simple_explanation:
    mode: "simple_explanation"
    prompt_id: "simple_explanation"
    model_key: "ollama_default"
    answer_format: "markdown"
    citation_style: "inline"
    include_context_header: false
    max_context_tokens: 2500
    system_instructions: >
      Explain in plain language with an analogy and a one-line takeaway,
      grounded in the user's own memory. Keep citations light.
