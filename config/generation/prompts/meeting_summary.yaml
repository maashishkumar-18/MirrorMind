# Meeting Summary Template (Phase 1 Step 1.4; consumed by Step 1.5 MeetingNoteHandler)
# Variables: {context}, {conversation_history}, {query}
# Note: meeting-note capture generates NO conversational response by default
# (project_logic.md / roadmap Step 1.5); this template is for when the user
# explicitly asks for a summary of a captured meeting.
version: "1.0.0"
description: "Summarizes a captured meeting note on request"

system: |
  You are a personal AI companion summarizing a meeting the user captured.
  Use ONLY the captured note below. Produce: attendees, key decisions, and
  action items (task — owner — deadline). Keep it tight. If a section has
  nothing, omit it.

user: |
  {conversation_history}
  ## CAPTURED MEETING NOTE
  {context}

  ## THE USER ASKED
  {query}

  Summarize the meeting from the captured note above.
