# Available LLM Models (Phase 1 Step 1.4 — local-only)
# The Personal AI Companion runs entirely on a bundled Ollama sidecar; no API
# keys, no cloud providers in v1 (cloud adapters return in v1.1).
models:
  ollama_default:
    provider: "ollama"
    # No model_name here on purpose: GenerationConfig.from_yaml resolves it from
    # $OLLAMA_DEFAULT_MODEL (fallback "llama3.1:8b"), matching simple_generate.
    temperature: 0.3
    max_output_tokens: 2048
    top_p: 0.95
    # 120s (was 60s): a 7B/8B model generating a full answer on CPU inference
    # — no GPU acceleration on the reference-class hardware this ships to —
    # routinely needs 40-90s. A timeout here returns an empty error response,
    # which the eval then scores as a failed/ungrounded answer, contaminating
    # the calibration. Phase 2 Step 2.5 benchmarks real latency on the
    # reference spec; router.yaml's <3.5s budget is that target, not this ceiling.
    timeout_seconds: 120
    max_retries: 2
    retry_delay_seconds: 1.0
