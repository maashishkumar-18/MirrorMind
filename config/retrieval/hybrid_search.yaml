# Hybrid Search Configuration (Phase 1 Step 1.3b — local, session-shaped)
# Combines dense retrieval over the local SQLiteVectorStore, BM25 keyword
# search over the dense candidate pool, and a metadata-boost pass.

# Search strategy weights (must sum to 1.0)
weights:
  semantic: 0.6
  keyword: 0.25
  metadata: 0.15

# Candidate retrieval
candidates:
  semantic_k: 40       # Top-K from the vector store (also the BM25 corpus size)
  keyword_k: 20        # Top-K from BM25 keyword search
  max_total: 60        # Max candidates before deduplication

# Deduplication
dedup:
  threshold: 0.85      # Cosine similarity above which chunks are considered duplicates
  strategy: "score"    # "score" (keep highest) or "first" (keep first seen)

# Result merging
merge:
  strategy: "weighted" # "weighted", "rrf" (reciprocal rank fusion), or "interleave"
  rrf_k: 60           # RRF smoothing parameter (only used if strategy is "rrf")

# Score normalization
normalize:
  method: "minmax"     # "minmax" or "zscore"
  min_score: 0.0
  max_score: 1.0

# Metadata boost search
# Each field is appended to the query text for an extra down-weighted
# semantic pass. Every field here must be a real column on session_chunks
# (db/migrations/0001_initial_schema.sql) AND a field on
# SessionRetrievedChunk (src/common/sqlite_vector_store.py::_to_retrieved_chunk
# populates all of them) — the "key_topics silent mismatch" bug was a field
# configured here that never reached storage.
metadata:
  enabled: true
  fields:
    - "topics"
    - "action_types"
    - "entities"
    - "sentiment"
    - "message_roles"
  match_threshold: 0.3 # Multiplier applied to metadata-pass candidate scores
