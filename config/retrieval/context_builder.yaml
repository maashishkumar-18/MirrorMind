# Context Builder Configuration (Phase 1 Step 1.3c — session companion)
# Assembles the SessionRetrievedChunk list from RetrievalRouter.route() into a
# citation-tagged, token-budgeted context block for the generation prompt.

assembly:
  max_total_tokens: 3000
  max_chunks: 6
  separator: "\n\n---\n\n"
  truncation_marker: "\n\n[earlier context truncated]"
  truncate_at_sentence: true

citations:
  enabled: true
  # {session_id} and {timestamp} are the only placeholders — no document,
  # page, slide, course or chapter concepts (project_logic.md §12).
  format: "[Session {session_id} · approx. {timestamp}]"
  include_in_context: true

cleaning:
  normalize_whitespace: true
  remove_duplicate_lines: true

tokenization:
  # tiktoken, for context-window budgeting — NOT the chunker's AutoTokenizer
  # (src/ingestion/tokenizer.py), which sizes chunks against the embedding model.
  model: "gpt-4o"
