# Semantic coverage scoring config (src/retrieval/confidence.py).
#
# Trimmed to just this section in Phase 1 Step 1.3a — the document-era
# confidence thresholds / feature weights / retry machinery went with the
# study-assistant orchestrator. Loaded by SemanticCoverageConfig.from_yaml().

semantic_coverage:
  use_keywords: true               # keyword-overlap coverage
  min_query_term_overlap: 0.3      # minimum fraction of query terms in context
  use_embeddings: false            # blend in embedding cosine similarity
  embedding_model: null            # null -> all-MiniLM-L6-v2
  embedding_similarity_threshold: 0.7
  embedding_weight: 0.5            # keyword vs embedding blend when use_embeddings
  cache_embeddings: true
