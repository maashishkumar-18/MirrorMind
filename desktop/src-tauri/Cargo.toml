[package]
name = "mirrormind"
version = "0.1.0"
description = "MirrorMind — local-only Personal AI Companion (Tauri v2 desktop shell)"
authors = ["MirrorMind"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows
# cargo quirk — see rust-lang/cargo#8519).
name = "mirrormind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
